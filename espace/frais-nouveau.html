<body class="demo ">
  <header class="barre">
    <a class="logo" href="index.html"><img src="static/favicon.svg" alt="" width="34" height="33"><span><b>EQUATION</b><small>Espace B&amp;C</small></span></a>
    <div class="barre__droite">
      <span class="barre__nom">Arnaud Bucci</span>
      <form method="post" action="/deconnexion" data-demo><input type="hidden" name="_csrf" value="xlK5xSuzaURofo880OgXliSU2gik3BUZECGlWnbC42I"><button class="bouton-icone" type="submit" title="Se déconnecter" aria-label="Se déconnecter"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/></svg></button></form>
    </div>
  </header>
  <nav class="onglets" aria-label="Menu">
    <a href="index.html" aria-label="Accueil"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11 12 4l9 7M5.5 9.5V20h13V9.5"/></svg><span class="long">Accueil</span></a>
    <a href="frais.html" aria-label="Notes de frais" aria-current="page"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg><span class="long">Notes de frais</span><span class="court" aria-hidden="true">Frais</span></a>
    <a href="dossiers.html" aria-label="Dossiers"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5H9l2 2.5h8.5A1.5 1.5 0 0 1 21 9v9.5a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18.5z"/></svg><span class="long">Dossiers</span></a>
    <a href="equipe.html" aria-label="Accès"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18.5 20a6.5 6.5 0 0 0-2.5-5.1"/></svg><span class="long">Accès</span></a>
    <a href="compte.html" aria-label="Mon compte"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4.5 21a7.5 7.5 0 0 1 15 0"/></svg><span class="long">Mon compte</span><span class="court" aria-hidden="true">Compte</span></a></nav>
  <main class="contenu" id="contenu">
    
    
  <div class="entete-page"><a class="lien-retour" href="frais.html"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg> Notes de frais</a><h1>Nouvelle note de frais</h1></div>
  <div class="carte carte--etroite">
  <form method="post" action="/frais" data-demo enctype="multipart/form-data" class="formulaire formulaire-frais" data-envoi>
    <input type="hidden" name="_csrf" value="xlK5xSuzaURofo880OgXliSU2gik3BUZECGlWnbC42I">
    
    <label class="zone-photo">
      <input type="file" name="pieces" accept="image/*,application/pdf" capture="environment" multiple data-apercu-photos>
      <span class="zone-photo__invite"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h3l2-2.5h6L17 7h3v12H4z"/><circle cx="12" cy="13" r="3.5"/></svg><strong>Prendre en photo le ticket</strong><small>ou choisir une image / un PDF (plusieurs possibles)</small></span>
      <span class="zone-photo__apercus" aria-live="polite"></span>
    </label>
    <div class="champs-2">
      <label>Date<input type="date" name="date" value="2026-11-18" required></label>
      <label>Montant TTC (€)<input name="montant_ttc" inputmode="decimal" placeholder="0,00" value="" required data-montant></label>
    </div>
    <label>Fournisseur / magasin<input name="fournisseur" maxlength="150" value="" placeholder="Ex. : Point P, Total, Leroy Merlin…" required list="fournisseurs-connus"></label>
    <datalist id="fournisseurs-connus"><option value="TotalEnergies"><option value="Restaurant Le Relais"><option value="Point P"><option value="Leroy Merlin"><option value="Kiloutou"></datalist>
    <div class="champs-2">
      <label>Catégorie<select name="categorie"><option>Carburant</option><option>Matériaux et fournitures</option><option>Outillage</option><option>Repas</option><option>Péage et stationnement</option><option>Hébergement</option><option>Véhicule et entretien</option><option>Location de matériel</option><option>Autre</option></select></label>
      <label>Payé par<select name="paiement"><option value="">Non précisé</option><option>Carte entreprise</option><option>Virement</option><option>Espèces</option><option>Carte personnelle (à rembourser)</option></select></label>
    </div>
    <div class="champs-2">
      <label>Taux de TVA<select data-taux><option value="20">20 %</option><option value="10">10 %</option><option value="5.5">5,5 %</option><option value="0">Pas de TVA</option><option value="">Autre (saisir)</option></select></label>
      <label>Montant de TVA (€)<input name="tva" inputmode="decimal" placeholder="0,00" value="" data-tva><small>Calculé automatiquement, modifiable.</small></label>
    </div>
    <label>Chantier concerné <span class="discret">(facultatif)</span><select name="dossier_id"><option value="">Aucun</option><option value="3">Cuisine ouverte Martin</option><option value="2">Mise aux normes électriques bureaux</option><option value="1">Rénovation salle de bain Dupont</option></select></label>
    <label>Commentaire <span class="discret">(facultatif)</span><textarea name="commentaire" rows="2" maxlength="1000"></textarea></label>
    <button class="bouton bouton--plein bouton--large" type="submit">Enregistrer la note</button>
  </form></div>
  </main>
  
<div class="bandeau-demo" role="note">Version de démonstration · données fictives · les actions sont désactivées</div>
  <div class="toast-demo" role="status" aria-live="polite"></div>
  <script src="static/demo.js"></script>
</body>
</html>
